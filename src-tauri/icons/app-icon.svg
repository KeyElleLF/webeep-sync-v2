<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- WeBeep Sync icon: sync arrows around a download arrow. No Polimi branding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fd6"/>
      <stop offset="1" stop-color="#173f8a"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- upper arc (clockwise, from left to right) -->
    <path d="M232 470 A288 288 0 0 1 760 330"/>
    <!-- lower arc (clockwise, from right to left) -->
    <path d="M792 554 A288 288 0 0 1 264 694"/>
    <!-- download arrow -->
    <path d="M512 330 V640"/>
    <path d="M400 540 L512 652 L624 540"/>
  </g>
  <g fill="#ffffff">
    <!-- arrow heads of the sync arcs -->
    <path d="M826 244 L806 420 L656 352 Z"/>
    <path d="M198 780 L218 604 L368 672 Z"/>
  </g>
</svg>
