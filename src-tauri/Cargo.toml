[package]
name = "webeep-sync"
version = "0.2.0"
description = "Client desktop non ufficiale per sincronizzare il materiale di WeBeep"
authors = ["WeBeep Sync contributors"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "webeep_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "http2", "charset", "stream"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "fs", "time", "io-util"] }
keyring = "4.2.0"
thiserror = "2.0.21"
md-5 = "0.11.0"
base64 = "0.23.1"
url = "2.5.8"
rand = "0.10.3"
tracing = "0.1.44"
chrono = "0.4.45"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13.1"
percent-encoding = "2.3.2"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
tauri-plugin-dialog = "2.8.4"
trash = "5.3.0"
ammonia = "4.2.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tracing-appender = "0.2.5"
pdf-extract = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Not "abort": a malformed PDF (study plan import) must fail with a message, not close the app
# (pdf-extract can panic; the panic is caught in `courses::plan_file`).
panic = "unwind"
strip = true

[dev-dependencies]
lopdf = "0.36"
tempfile = "3.27.0"
wiremock = "0.6.5"
